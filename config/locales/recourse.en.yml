en:
  # Namespaced rather than `default`, so a host's own date and time formats stand.
  date:
    formats:
      recourse: "%b %-d, %Y"
      # A calendar's own two: the day over one of its columns, `Sun 13`, and the month
      # a week is named by, whose day is an ordinal Ruby writes rather than a format.
      recourse_day: "%a %-d"
      recourse_month: "%B"
  time:
    formats:
      recourse: "%b %-d at %I:%M%P %Z"
      # The scale down a calendar, `9am`, and the hours one row runs between, `9:30am`.
      recourse_hour: "%-I%P"
      recourse_time: "%-I:%M%P"
  recourse:
    add: Add %{model}
    ago: "%{distance} ago"
    all: All %{models}
    all_values: All
    as_calendar: Display as calendar
    as_map: Display as map
    as_table: Display as table
    # One message in four spellings: what a record is holding, under the field that
    # adds to it.
    attached:
      many: "%{count} files attached (%{files})"
      none: No file attached
      none_many: No files attached
      one: 1 file attached (%{files})
    blank: "—"
    bookmark: Bookmark
    bookmark_added: Bookmark added
    bookmark_error: Bookmark could not be saved.
    bookmark_removed: Bookmark removed
    cancel: Cancel
    clear: Clear search
    compact: Compact
    create: Create
    created: "%{record} was created."
    created_error: "%{model} could not be created."
    darken: Dark
    delete: Delete %{model}
    deleted: "%{model} was deleted."
    destroy: Delete
    exit: Exit
    displaying:
      one: Displaying 1 item
      other: Displaying %{count} items
    displaying_slice: Displaying items %{from}-%{to} of %{total}
    edit: Edit
    expand: Expand
    format: Please match the format %{example}
    from_now: "in %{distance}"
    # How many values a list holds, which is what its summary reads before anybody
    # opens it.
    items:
      one: 1 item
      other: "%{count} items"
    lighten: Light
    missing_model: You declared `recourses :%{name}` in your routes file, but this app
      has no %{model} model.
    nested: You nested `recourses %{names}` inside `resources :%{parent}`, which does
      not namespace what it holds. Nest it under `recourses :%{parent}` instead.
    # What a menu with several picks reads as, the first named and the rest counted.
    more: "%{first} + %{count} more"
    new: New %{model}
    new_tab: Open in a new tab
    next_week: Next week
    no_results: No results found
    none: "No %{models}."
    optional: Optional
    per_page: "%{limit} per page"
    preview: Preview
    previous_week: Previous week
    ambiguous: "matches more than one record, so it does not say which: %{label}"
    reference: "%{model} %{attribute}"
    reveal: Show
    search: Search…
    searched_cont: Filter by %{list}
    searched_eq: Filter by exact %{list}
    select: Select…
    show: Show
    unbookmark: Remove bookmark
    unknown_color: "`Recourse.color` is one of %{colors}, or nil for Bootstrap's own
      blue. It cannot be %{color}."
    unknown_theme: "`Recourse.theme` is one of %{themes}, or nil for Bootstrap's own
      palette. It cannot be %{theme}."
    updated: "%{record} was updated."
    updated_error: "%{model} could not be updated."
    unset: None
    # The two days a calendar's week runs between, and the year both are in.
    week: "%{from} – %{to}, %{year}"
    deletion:
      delete: Delete
      title: Delete %{record}?
      going: "%{list} will be deleted with it."
      staying: "%{list} will be kept, without its %{model}."
      under: Anything under those goes too.
      undone: This cannot be undone.
