name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  # The default task: the suite at 100% coverage, RuboCop, and the file-length ceiling.
  # On the Ruby the host apps run, and on the oldest the gemspec still admits.
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: [ '3.4', '4.0' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Test, lint and measure
        run: bundle exec rake
