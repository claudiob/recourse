name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  # The default task: the suite at 100% coverage, RuboCop, and the file-length ceiling.
  # On the Ruby the host apps run, and on the oldest the gemspec still admits.
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: [ '3.4', '4.0' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # ruby-vips binds the system libvips through FFI, and no runner image carries
      # it: without it Active Storage's own initializer cannot require the vips
      # transformer and the dummy app never boots. The `-dev` package rather than the
      # runtime one, whose name moves between releases — `libvips42` on jammy,
      # `libvips42t64` on noble — while this one has always been spelled the same.
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Test, lint and measure
        run: bundle exec rake
