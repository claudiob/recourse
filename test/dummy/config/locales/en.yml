en:
  recourse:
    models:
      # A memo is withdrawn rather than deleted, which is what a host says here when the
      # one word the gem has is the wrong one for a model.
      memo:
        delete: Withdraw %{model}
        deletion_title: Withdraw %{record}?

  activerecord:
    models:
      # A kind the locale names, beside one it does not: a filter reads each the way
      # Rails reads a model's own name.
      sensor/radar: Radar gauge
